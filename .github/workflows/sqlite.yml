name: SQLite storage
on:
  pull_request:
    paths: ['apps/api/**', 'docs/imports/**', '.github/workflows/sqlite.yml']
  push:
    paths: ['apps/api/**', 'docs/imports/**', '.github/workflows/sqlite.yml']
permissions:
  contents: read
jobs:
  sqlite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --import tsx --test ../web/tests/playClock.test.ts ../web/tests/routeOpenness.test.ts ../web/tests/passInterception.test.ts ../web/tests/conversions.test.ts ../web/tests/playerGameLog.test.ts ../web/tests/playerCareerStats.test.ts
  import-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s docs/imports/core -p 'test_*.py' -v
      - run: python -m unittest discover -s docs/imports/season -p 'test_*.py' -v
      - run: python -m unittest discover -s docs/imports/remaining -p 'test_*.py' -v
      - run: python -m unittest discover -s docs/imports/corrections -p 'test_*.py' -v
